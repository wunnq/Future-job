           <Em chọn nghề kỹ thuật (như kỹ sư cơ khí, điện – điện tử hoặc công nghệ) làm định hướng nghề nghiệp cho bản thân. Lý do em chọn nghề này là vì em thích công việc mang tính thực hành, được trực tiếp lắp ráp, sửa chữa và vận hành máy móc hơn là chỉ làm việc trên giấy tờ. Ngoài ra, nhóm nghề kỹ thuật có nhu cầu cao trong xã hội, cơ hội việc làm ổn định và giúp em phát huy được sự kiên trì, cẩn thận và tư duy logic của mình
